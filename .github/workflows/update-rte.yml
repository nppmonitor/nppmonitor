name: "Actualisation Temps Réel RTE"

on:
  schedule:
    # Exécution automatique toutes les 30 minutes
    - cron: '*/1 * * * *'
  workflow_dispatch: # Permet de déclencher manuellement en 1 clic

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Synchronisation avec les APIs officielles RTE
        env:
          RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
          RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
          RTE_UNAVAILABILITY_CLIENT_ID: ${{ secrets.RTE_UNAVAILABILITY_CLIENT_ID }}
          RTE_UNAVAILABILITY_CLIENT_SECRET: ${{ secrets.RTE_UNAVAILABILITY_CLIENT_SECRET }}
        run: |
          python3 scripts/fetch_rte_units.py

      - name: Sauvegarde et publication des données
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_units.json js/live_units.js
          git diff --staged --quiet || (git commit -m "chore(data): actualisation automatique télémesure RTE" && git push)
